<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Нейросфера — живой офис ИИ-агентов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1117;--panel:#161b24;--panel2:#1d2430;--line:#2a3342;--ink:#e8edf5;--mute:#8b96a8;--acc:#ffd166;--good:#3ddc97;--bad:#ff6b6b;--blue:#5aa9ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-size:13px;overflow:hidden}
#app{display:grid;grid-template-rows:auto 1fr;height:100vh}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-family:'Press Start 2P',monospace;font-size:11px;color:var(--acc);letter-spacing:1px;white-space:nowrap}
.brand small{display:block;font-family:Manrope;font-size:10px;color:var(--mute);letter-spacing:0;margin-top:3px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 9px;white-space:nowrap}
.stat b{font-size:13px}.stat span{color:var(--mute);font-size:10px;display:block}
.clock{font-family:'Press Start 2P';font-size:12px}
.grow{flex:1}
button{font-family:inherit;font-size:12px;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:#4a5872;background:#232c3a}
button.on{background:#2b3a26;border-color:var(--good);color:#c9ffd9}
button.gold{background:#3a3220;border-color:#a8842c;color:var(--acc)}
button.red{background:#3a2024;border-color:#a33;color:#ffc9c9}
.seg{display:flex;gap:2px;flex-wrap:wrap}.seg button{padding:5px 8px}
main{display:grid;grid-template-columns:1fr 380px;min-height:0}
#stageWrap{position:relative;min-height:0;overflow:hidden;background:#0a0d12}
canvas{display:block;width:100%;height:100%;cursor:grab}
canvas.drag{cursor:grabbing}
#tip{position:absolute;pointer-events:none;background:rgba(10,13,18,.92);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;display:none;max-width:260px;z-index:5}
#zoomCtl{position:absolute;left:10px;bottom:10px;display:flex;gap:4px}
#legend{position:absolute;right:10px;bottom:10px;background:rgba(14,17,23,.85);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:11px;color:var(--mute)}
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs{flex-wrap:wrap}.badge{background:#ff6b6b;color:#fff;border-radius:9px;padding:0 5px;font-size:10px;margin-left:3px}details summary{cursor:pointer}
.tabs button{flex:1 1 auto;font-size:11px;border:0;border-radius:0;background:transparent;padding:9px 2px;color:var(--mute);border-bottom:2px solid transparent}
.tabs button.act{color:var(--ink);border-bottom-color:var(--acc)}
.pane{flex:1;overflow:auto;padding:12px;min-height:0}
.feed div{padding:6px 0;border-bottom:1px dashed #232b38;line-height:1.35}
.feed .t{color:var(--mute);font-size:10px;margin-right:5px;font-family:monospace}
.feed .dir{color:var(--acc)}.feed .bad{color:#ff9d9d}.feed .good{color:#9dffcf}.feed .ai{color:#c9b6ff}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.card h4{margin:0 0 6px;font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.who{display:flex;gap:10px;align-items:center}
.who canvas{width:56px;height:56px;border-radius:10px;background:#222b38;image-rendering:pixelated;cursor:default;flex:none}
.who .nm{font-size:16px;font-weight:800}.who .rl{color:var(--mute);font-size:12px}
.bar{height:7px;background:#0d1117;border-radius:4px;overflow:hidden;margin:3px 0 7px}
.bar i{display:block;height:100%;border-radius:4px}
.row{display:flex;justify-content:space-between;font-size:12px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;background:#232c3a;border-radius:20px;padding:2px 8px;margin:2px 3px 2px 0;font-size:11px}
.thought{font-style:italic;color:#d5dcff}
ul.duty{margin:0;padding-left:16px}ul.duty li{margin:3px 0;line-height:1.35}
input,textarea,select{font-family:inherit;font-size:13px;color:var(--ink);background:#0f141c;border:1px solid var(--line);border-radius:7px;padding:7px;width:100%}
.proj{border:1px solid var(--line);border-radius:9px;padding:8px;margin-bottom:8px;background:var(--panel2)}
.stages{display:flex;gap:2px;margin:6px 0}.stages i{flex:1;height:6px;border-radius:3px;background:#2a3342}.stages i.d{background:var(--good)}.stages i.c{background:var(--acc)}
.kpirow{display:grid;grid-template-columns:22px 1fr 44px;gap:6px;align-items:center;padding:4px 0;cursor:pointer;border-bottom:1px solid #1f2632}
.kpirow:hover{background:#1b222d}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20}
.modal.show{display:flex}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;width:min(760px,94vw);max-height:88vh;overflow:auto}
.dlg h3{margin:0 0 10px}
.org{display:flex;flex-direction:column;align-items:center;gap:8px}
.orgrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.orgbox{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:11px;text-align:center;cursor:pointer}
.orgbox b{display:block;font-size:12px}
.orgbox.top{border-color:var(--acc);color:var(--acc)}
.chat{height:280px;overflow:auto;background:#0f141c;border-radius:8px;padding:8px;margin-bottom:8px}
.chat .m{margin:6px 0;max-width:85%;padding:6px 9px;border-radius:9px;line-height:1.4}
.chat .u{background:#2b3a26;margin-left:auto}.chat .a{background:#232c3a}
.note{font-size:11px;color:var(--mute);line-height:1.4}
@media (max-width:900px){main{grid-template-columns:1fr;grid-template-rows:55vh 1fr}aside{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>

<header>
  <div class="brand">НЕЙРОСФЕРА<small>живой офис ИИ-агентов</small></div>

  </div>
  <aside>

    </div>
    <div class="pane" id="pane"></div>
  </aside>
</main>
</div>
<div class="modal" id="modal"><div class="dlg" id="dlg"></div></div>

async function askJSON(prompt){const full=prompt+'\nОтвечай ТОЛЬКО валидным JSON без пояснений. Язык — русский.';
 if(AI.s.json){try{return await AI.s.json(full,{modelTier:'quick',cache:false})}catch(e){if(e&&(e.code==='rate_limited'||e.code==='not_granted'))throw e}}

 '<div class="btns" style="margin-top:8px"><button class="gold" onclick="cCollect()">📥 Собрать потребности отделов</button><button onclick="cCopy()">📋 Скопировать план подключения</button></div><div class="note" id="copyNote"></div></div>'+

 if(connView==='ap'){const A=S.requests.filter(r=>r.status==='approved');h+='<div class="note" style="margin-bottom:6px">Согласовано директором, но ещё не подключено. Подключите сервис по инструкции и нажмите «🔌 Отметить подключённым» — он переедет в «Подключённые».</div>'+(A.length?A.map(reqCard).join(''):'<div class="note">Одобренных, но не подключённых сервисов нет.</div>')}else if(connView==='on'){h+=connectedHTML()}else if(connView==='req'){const order=['director','security','head','later','connected','rejected'];const L=S.requests.filter(r=>r.status!=='approved').sort((a,b)=>order.indexOf(a.status)-order.indexOf(b.status));h+=L.length?L.map(reqCard).join(''):'<div class="note">Заявок пока нет. Они появятся, когда агенты возьмут задачи, для которых нужны внешние сервисы, — или нажмите «Собрать потребности отделов».</div>'}
 else{const cats=[...new Set(CONN.map(c=>c.cat))];const LC=CONN.filter(c=>!onlyFull||c.auto==='full');h+=cats.filter(cat=>LC.some(c=>c.cat===cat)).map(cat=>'<div class="card"><h4>'+cat+'</h4>'+LC.filter(c=>c.cat===cat).map(c=>{const st=connState(c.key),req=pendingReq(c.key);const lbl=(S.connNote&&S.connNote[c.key]&&st!=='connected')?'<span style="color:#ffb36b">не завершено</span>':st==='connected'?'<span style="color:#3ddc97">подключено</span>':st==='approved'?'<span style="color:#5aa9ff">одобрено</span>':req?'<span style="color:#ffd166">заявка</span>':'<span class="note">нет</span>';
  return'<div style="padding:5px 0;border-bottom:1px solid #222a36"><div class="row"><b style="font-size:12px">'+esc(c.name)+'</b>'+lbl+'</div>'+(S.connNote&&S.connNote[c.key]&&connState(c.key)!=='connected'?'<div class="note" style="color:#ffb36b">⚠ '+esc(S.connNote[c.key])+'</div>':'')+'<div class="note">'+autoBadge(c)+' · '+esc(c.why)+' · '+c.depts.map(d=>DEPTS[d].n).join(', ')+' · риск '+RISK[c.risk]+' · '+(c.via==='claude'?'коннектор Claude':c.via==='api'?'API':'аккаунт')+'</div><div class="btns" style="margin-top:4px">'+(st==='connected'?'<button onclick="cMark(\''+c.key+'\',false)">Отключить</button>':'<button class="gold" onclick="cMark(\''+c.key+'\',true)">🔌 Отметить подключённым</button>')+'</div><details><summary style="font-size:12px;color:#5aa9ff;margin-top:3px">📖 Инструкция по подключению</summary>'+guideHTML(c)+'</details></div>'}).join('')+'</div>').join('')}

function trHourly(hr){const T=S.tr;if(!T)return;
 for(const k in T.prices){T.prices[k]*=Math.exp(rand(-1,1)*0.012+0.0003)}
 if(T.halted){T.hist.push(T.eq);if(T.hist.length>400)T.hist.shift();return}
 const active=T.strats.filter(s=>s.stage==='paper'||s.stage==='candidate'||s.stage==='approved');
 for(const s of active){const perDay=0.3;if(Math.random()>perDay)continue;const riskAmt=T.eq*T.lim.risk/100;const R=(s.edge*0.4+(Math.random()+Math.random()+Math.random()-1.5)*1.6)*Math.min(T.lim.lev,2);const pnl=Math.round((riskAmt*R-riskAmt*0.15)*100)/100;
  T.eq+=pnl;T.trades++;s.paper.trades++;if(pnl>0)s.paper.wins++;s.paper.pnl+=pnl;s.paper.peak=Math.max(s.paper.peak,s.paper.pnl);s.paper.dd=Math.max(s.paper.dd,s.paper.peak-s.paper.pnl);
  const tr=deptAgents('crypto_desk').filter(b=>!b.hidden&&b.id!=='cr_cio');if(tr.length){const b=pick(tr);b.inbox.unshift(mkTask('Исполнить сигнал «'+s.name+' '+s.sym+'»','crypto_desk',{work:ri(8,15)}));if(Math.abs(pnl)>riskAmt*0.5)floatTxt(b.x,b.y-40,(pnl>0?'+':'')+Math.round(pnl)+' $',pnl>0?'#3ddc97':'#ff6b6b')}}
 T.peak=Math.max(T.peak,T.eq);T.hist.push(T.eq);if(T.hist.length>400)T.hist.shift();
 const dayLoss=(T.dayStart-T.eq)/T.dayStart*100,dd=(T.peak-T.eq)/T.peak*100;const cro=byId('cr_cro');
 if(dd>=T.lim.dd){T.halted=true;T.haltReason='Просадка '+dd.toFixed(1)+'% ≥ лимита '+T.lim.dd+'% — возобновить может только директор';log('⛔','CRO остановил всю торговлю: просадка '+dd.toFixed(1)+'%. Нужен ваш разбор (вкладка «Трейдинг»)','bad');if(cro&&!cro.hidden)say(cro,'Стоп! Просадка превысила лимит. Торговля остановлена.',5)}
 else if(dayLoss>=T.lim.daily){T.halted=true;T.haltReason='Дневной убыток '+dayLoss.toFixed(1)+'% ≥ '+T.lim.daily+'% — торговля возобновится завтра';T.dayHalt=true;log('🛑','CRO: дневной лимит убытка достигнут ('+dayLoss.toFixed(1)+'%). Стоп до завтра','bad');if(cro&&!cro.hidden)say(cro,'Дневной лимит убытка. Стоп до завтра.',4)}
 // кандидаты
 for(const s of T.strats){if(s.stage==='paper'&&S.day-s.paper.start>=PAPER_DAYS&&s.paper.trades>=6){if(s.paper.pnl>0&&s.paper.dd<T.start*T.lim.dd/100){s.stage='candidate';log('📨','CIO: «'+s.name+' '+s.sym+'» '+PAPER_DAYS+' дней в плюсе на бумаге ('+(s.paper.pnl>0?'+':'')+Math.round(s.paper.pnl)+' $). Ждёт вашего решения — вкладка «Трейдинг»','dir');const ci=byId('cr_cio');if(ci&&!ci.hidden)say(ci,'Директор, есть кандидат на реальную торговлю',4)}else{s.stage='archived';log('🗄','«'+s.name+' '+s.sym+'» не прошла бумажную торговлю — в архив','bad')}}}
 // новые идеи
 if(hr===Math.floor(WS()/60)+2||hr===Math.floor(WE()/60)-3){const pipe=T.strats.filter(s=>['idea','backtest','risk'].includes(s.stage)).length;const act=T.strats.filter(s=>['paper','candidate','approved'].includes(s.stage)).length;if(pipe<1&&act<4){const r=deptAgents('crypto_research')[0];if(r)r.inbox.push(mkTask('Идея стратегии на основе рынка','crypto_research',{ckind:'idea',work:ri(50,90)}))}}

 h+='<div class="card"><h4>Отчёт №'+rep.id+' · День '+rep.day+', '+rep.time+' <span class="note">('+esc(rep.reason)+')</span></h4>'+
 '<div class="row"><span>Касса</span><b>'+fmt(m.cash)+'</b></div><div class="row"><span>Выручка в день</span><b>'+fmt(m.rev)+'</b></div><div class="row"><span>Зарплаты в день</span><b>'+fmt(m.pay)+'</b></div><div class="row"><span>Результат дня</span><b style="color:'+(m.net>=0?'#3ddc97':'#ff6b6b')+'">'+fmt(m.net)+'</b></div><div class="row"><span>Запас денег</span><b>'+(m.runway===Infinity||m.runway==null?'без ограничений':m.runway+' дн.')+'</b></div><div class="row"><span>Проекты: в воронке / с доходом</span><b>'+m.pipe+' / '+m.live+'</b></div><div class="row"><span>Задач в день · ошибок</span><b>'+m.perDay+' · '+Math.round(m.errRate*100)+'%</b></div><div class="row"><span>Средний KPI · сотрудников</span><b>'+m.avgKpi+' · '+m.L+'</b></div></div>';
 if(rep.ai)h+='<div class="card" style="border-color:#5aa9ff"><h4>🧠 Резюме CDO</h4><div>'+esc(rep.ai.summary||'')+'</div>'+(rep.ai.risk?'<div class="note" style="margin-top:4px">⚠ Риск: '+esc(rep.ai.risk)+'</div>':'')+(rep.ai.bet?'<div class="note">🎯 Ставка: '+esc(rep.ai.bet)+'</div>':'')+'</div>';
 h+='<div class="card"><h4>Куда идём</h4><div class="note" style="margin-bottom:4px">'+esc(rep.dir.vision)+'</div><ul class="duty">'+rep.dir.goals.map(g=>'<li>'+esc(g)+'</li>').join('')+'</ul></div>';
 h+='<div class="card"><h4>Практические рекомендации</h4>'+(rep.recs.length?rep.recs.map(r=>'<div class="proj" style="'+(r.status!=='new'?'opacity:.6':'')+'"><div class="row"><b>'+esc(r.title)+'</b><span style="font-size:11px;color:'+DV_P[r.pr][1]+'">'+DV_P[r.pr][0]+'</span></div><div class="note" style="margin-top:3px"><b>Почему:</b> '+esc(r.why)+'</div><div class="note"><b>Что сделать:</b> '+esc(r.act)+'</div><div class="note"><b>Эффект:</b> '+esc(r.eff)+'</div><div class="btns" style="margin-top:6px">'+(r.status==='new'?'<button class="on" onclick="devAct(\''+r.id+'\',true)">✔ Принять и запустить</button><button class="red" onclick="devAct(\''+r.id+'\',false)">✖ Отклонить</button>':'<span class="note">'+(r.status==='accepted'?'✅ Принято, в работе':'✖ Отклонено')+'</span>')+'</div></div>').join(''):'<div class="note">Критичных проблем нет. Продолжаем по плану.</div>')+'</div>';
 h+='<div class="card"><h4>Нагрузка и KPI отделов</h4>'+rep.depts.slice().sort((x,y)=>y.load-x.load).map(d=>'<div class="row"><span style="color:'+DEPTS[d.k].col+'">'+DEPTS[d.k].n+'</span><span>очередь '+d.load+'/чел · KPI <b style="color:'+kcol(d.kpi)+'">'+d.kpi+'</b></span></div>').join('')+'</div>';
 h+='<div class="card"><h4>Вопрос директору по развитию</h4><div class="btns"><input id="dvQ" placeholder="Например: что закрыть, чтобы выйти в плюс?" style="flex:1"><button class="gold" onclick="devAsk()">Спросить</button></div>'+((S.dev.qa||[]).map(x=>'<div style="margin-top:8px"><div class="note">Д'+x.day+' '+x.time+' · '+esc(x.q)+'</div><div>'+esc(x.a)+'</div></div>').join(''))+'</div>';
 if(S.dev.reports.length>1)h+='<div class="card"><h4>Прошлые отчёты</h4>'+S.dev.reports.slice(1).map(r=>'<div class="note">№'+r.id+' · День '+r.day+' — '+r.recs.length+' рекомендаций, принято '+r.recs.filter(x=>x.status==='accepted').length+'; результат дня '+fmt(r.m.net)+'</div>').join('')+'</div>';
 pane.innerHTML=h}

requestAnimationFrame(loop);
