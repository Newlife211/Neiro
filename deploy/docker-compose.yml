# Запуск на VPS: cd deploy && docker compose up -d --build
services:
  app:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    env_file: .env
    volumes:
      - neuro-data:/data
      - neuro-workspace:/workspace
    expose: ["8080"]
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

  # HTTPS с автоматическим сертификатом Let's Encrypt
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [app]

volumes:
  neuro-data:
  neuro-workspace:
  caddy-data:
  caddy-config:
